<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- bootstrap-link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- css-link -->
    <link rel="stylesheet" href="./crud.css">
    <title>Document</title>
</head>

<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#" style="font-weight: bold;">User Management</a>
        </div>
    </nav>
    <div class="container mt-4">
        <!-- Title + Add Button -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0"> Users </h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal"><span
                    class="me-1">+</span>Add User</button>
        </div>

        <!-- Search -->
        <div class="mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="Search by name, email or mobile">
        </div>
        <!-- Role and Status Filter -->
        <div class="row mb-3">
            <!-- Role Filter -->
            <div class="col-md-6 mb-2">
                <select id="roleFilter" class="form-select">
                    <option value="">All Roles</option>
                    <option value="Admin">Admin</option>
                    <option value="Manager">Manager</option>
                    <option value="Staff">Staff</option>
                </select>
            </div>

            <!-- Status Filter -->
            <div class="col-md-6 mb-2">
                <select id="statusFilter" class="form-select">
                    <option value="">All Status</option>
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                </select>
            </div>
        </div>

        <!-- Sort -->
        <div class="mb-3">
            <select id="sortFilter" class="form-select">
                <option value="">
                    Sort By
                </option>
                <option value="nameAsc">
                    Name: A to Z
                </option>
                <option value="nameDesc">
                    Name: Z to A
                </option>
                <option value="dateAsc">
                    Created Date: Oldest First
                </option>
                <option value="dateDesc">
                    Created Date: Newest First
                </option>
            </select>
        </div>

        <!-- bulk and delete btn -->
        <div class="d-flex justify-content-end gap-2 mb-3">
            <button id="bulkEdit" class="btn btn-warning">
                Bulk Edit
            </button>
            <button id="deleteSelected" class="btn btn-danger">
                Delete Selected
            </button>
        </div>

        <!-- User Table -->
        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created Date</th>
                        <th>Audit</th>
                        <th><span class="spanfa">Select</span><input type="checkbox" id="selectAll"></th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="9" class="text-center"> No users found </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="d-flex justify-content-center mt-3">
            <ul class="pagination" id="pagination">
            </ul>
        </div>
    </div>

    <!-- Add User Modal -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title">
                        ADD USER
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>
                </div>
                <!-- Modal Body -->
                <div class="modal-body">
                    <form id="userForm">
                        <!-- Full Name -->
                        <div class="mb-3">
                            <label class="form-label">
                                Full Name
                            </label>
                            <input type="text" id="fullName" class="form-control" placeholder="Enter full name">
                            <div id="fullNameError" class="text-danger small">
                            </div>
                        </div>
                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">
                                Email
                            </label>
                            <input type="email" id="email" class="form-control" placeholder="Enter email">
                            <div id="emailError" class="text-danger small">
                            </div>
                        </div>
                        <!-- Mobile -->
                        <div class="mb-3">
                            <label class="form-label">
                                Mobile
                            </label>
                            <input type="text" id="mobile" class="form-control" placeholder="Enter 10 digit mobile">
                            <div id="mobileError" class="text-danger small">
                            </div>
                        </div>
                        <!-- Role -->
                        <div class="mb-3">
                            <label class="form-label">
                                Role
                            </label>
                            <select id="role" class="form-select">
                                <option value="">
                                    Select Role
                                </option>
                                <option value="Admin">
                                    Admin
                                </option>
                                <option value="Manager">
                                    Manager
                                </option>
                                <option value="Staff">
                                    Staff
                                </option>
                            </select>
                            <div id="roleError" class="text-danger small">
                            </div>
                        </div>
                        <!-- Status -->
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="status" checked>
                            <label class="form-check-label" for="status">
                                Active
                            </label>
                        </div>
                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary">
                            Save User
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- delete user modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <!-- Header -->
                <div class="modal-header">
                    <h5 class="modal-title">
                        Delete User
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">
                        Are you sure you want to delete this user?
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="button" id="confirmDelete" class="btn btn-danger">
                        Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bulk Edit Modal -->
    <div class="modal fade" id="bulkEditModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        Bulk Edit Users
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead class="table-dark">
                                <tr>
                                    <th>Full Name</th>
                                    <th>Email</th>
                                    <th>Mobile</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="bulkEditTableBody">
                                <!-- Selected users will be added by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="button" id="saveBulkEdit" class="btn btn-primary">
                        Update Selected
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast message -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="userToast" class="toast" role="alert">
            <div class="toast-header">
                <strong class="me-auto">User Management</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast">
                </button>
            </div>
            <div class="toast-body" id="toastMessage">
            </div>
        </div>
    </div>

    <!-- bootstrap-js-link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- crud-js-link -->
    <script src="./crud.js"></script>
</body>

</html>
